name: Python CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: Build wheel
        run: python -m build
      - name: Install wheel into clean environment
        run: |
          python -m venv .venv-wheel
          if [ -f .venv-wheel/Scripts/python.exe ]; then PY=.venv-wheel/Scripts/python.exe; else PY=.venv-wheel/bin/python; fi
          "$PY" -m pip install dist/*.whl
          echo "WHEEL_PY=$PY" >> "$GITHUB_ENV"
      - name: CLI success scenario matches saved report
        run: |
          "$WHEEL_PY" -m kzp_lab06 data/input.csv out/summary.txt
          diff out/summary.txt reports/summary.txt
      - name: CLI error scenario returns code 2
        run: |
          set +e
          "$WHEEL_PY" -m kzp_lab06 data/broken.csv out/broken.txt
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: kzp-lab06-wheel-${{ matrix.os }}
          path: dist/*.whl
