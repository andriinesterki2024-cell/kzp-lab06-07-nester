[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kzp-lab06"
version = "6.0.0"
description = "Обробка CSV ремонтної майстерні (КЗП, ЛР6, варіант 16)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Нестер А.В., КІ-303" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.scripts]
kzp-lab06 = "kzp_lab06.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
